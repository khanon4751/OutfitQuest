<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Outfit Quest: ADHD Dressing Game</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel compiler for inline JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @keyframes bounce-short {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .animate-bounce-short {
      animation: bounce-short 0.4s ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen font-sans selection:bg-amber-500 selection:text-slate-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SCENARIOS = [
      {
        id: "rainy_school",
        title: "Rainy School Day 🌧️",
        weather: "Cold & Pouring Rain",
        activity: "Walking to school outdoors",
        requiredTags: ["rainproof", "warm", "waterproof_shoes"],
        hint: "Pick things that keep you dry and warm!",
        bgGradient: "from-blue-900 via-slate-900 to-indigo-950",
        avatarBg: "bg-blue-950/60"
      },
      {
        id: "gym_class",
        title: "Gym Class / Sports ⚽",
        weather: "Warm & Sunny",
        activity: "Running around in the gym",
        requiredTags: ["breathable", "stretchy", "athletic_shoes"],
        hint: "Pick comfy clothes you can run fast in!",
        bgGradient: "from-amber-900 via-orange-950 to-slate-950",
        avatarBg: "bg-amber-950/60"
      },
      {
        id: "regular_school",
        title: "Regular School Day 🏫",
        weather: "Mild & Pleasant",
        activity: "Classroom learning & recess",
        requiredTags: ["comfy_top", "casual_bottom", "sneakers"],
        hint: "Pick comfortable, everyday school clothes!",
        bgGradient: "from-teal-900 via-slate-900 to-emerald-950",
        avatarBg: "bg-teal-950/60"
      }
    ];

    const CLOTHES = {
      tops: [
        { id: "raincoat", name: "Yellow Raincoat 🧥", tags: ["rainproof", "warm"], icon: "🧥" },
        { id: "tshirt", name: "Sports T-Shirt 👕", tags: ["breathable", "stretchy"], icon: "👕" },
        { id: "polo_hoodie", name: "School Polo / Hoodie 🧥", tags: ["comfy_top"], icon: "👔" }
      ],
      bottoms: [
        { id: "rain_pants", name: "Rain Pants 👖", tags: ["rainproof", "warm"], icon: "👖" },
        { id: "shorts", name: "Athletic Shorts 🩳", tags: ["stretchy", "breathable"], icon: "🩳" },
        { id: "jeans", name: "Comfortable Jeans 👖", tags: ["casual_bottom"], icon: "👖" }
      ],
      shoes: [
        { id: "rain_boots", name: "Rain Boots 👢", tags: ["waterproof_shoes"], icon: "👢" },
        { id: "running_sneakers", name: "Running Sneakers 👟", tags: ["athletic_shoes"], icon: "👟" },
        { id: "everyday_sneakers", name: "Everyday Sneakers 👟", tags: ["sneakers"], icon: "👟" }
      ]
    };

    function App() {
      const [currentLevel, setCurrentLevel] = useState(0);
      const [selectedTop, setSelectedTop] = useState(null);
      const [selectedBottom, setSelectedBottom] = useState(null);
      const [selectedShoes, setSelectedShoes] = useState(null);
      const [feedback, setFeedback] = useState(null);
      const [stars, setStars] = useState(0);
      const [animateAvatar, setAnimateAvatar] = useState(false);

      const scenario = SCENARIOS[currentLevel];

      // Trigger avatar quick animation when selections change
      useEffect(() => {
        setAnimateAvatar(true);
        const timer = setTimeout(() => setAnimateAvatar(false), 400);
        return () => clearTimeout(timer);
      }, [selectedTop, selectedBottom, selectedShoes]);

      const handleCheckOutfit = () => {
        if (!selectedTop || !selectedBottom || !selectedShoes) {
          setFeedback({ 
            type: "warning", 
            message: "⚠️ Pick 1 Top, 1 Bottom, and 1 Pair of Shoes before checking!" 
          });
          return;
        }

        const chosenTags = [
          ...selectedTop.tags,
          ...selectedBottom.tags,
          ...selectedShoes.tags
        ];

        const missingTags = scenario.requiredTags.filter(tag => !chosenTags.includes(tag));

        if (missingTags.length === 0) {
          setFeedback({
            type: "success",
            message: "🎉 PERFECT OUTFIT! You're completely ready for this mission!"
          });
          setStars(prev => Math.min(prev + 1, 3));
        } else {
          setFeedback({
            type: "error",
            message: "⚡ Almost! Some of these items don't fit this weather or activity. Read the hint and try again!"
          });
        }
      };

      const handleNextLevel = () => {
        setSelectedTop(null);
        setSelectedBottom(null);
        setSelectedShoes(null);
        setFeedback(null);
        setCurrentLevel((prev) => (prev + 1) % SCENARIOS.length);
      };

      const handleReset = () => {
        setSelectedTop(null);
        setSelectedBottom(null);
        setSelectedShoes(null);
        setFeedback(null);
      };

      return (
        <div className="max-w-4xl mx-auto p-4 md:p-6 flex flex-col gap-6">
          {/* Top Bar Header */}
          <header className="flex flex-col sm:flex-row items-center justify-between gap-4 py-4 px-6 bg-slate-800/90 rounded-2xl border border-slate-700/80 shadow-xl backdrop-blur">
            <div>
              <h1 className="text-3xl font-extrabold text-amber-400 tracking-wide flex items-center gap-2">
                ✨ Outfit Quest
              </h1>
              <p className="text-slate-400 text-xs sm:text-sm mt-0.5">
                Practice picking the perfect clothes for real life!
              </p>
            </div>
            {/* Stars Counter */}
            <div className="flex items-center gap-2 bg-slate-900/80 px-4 py-2 rounded-xl border border-amber-500/30">
              <span className="text-amber-400 font-bold text-sm">Completed Missions:</span>
              <div className="flex gap-1 text-lg">
                {[0, 1, 2].map((idx) => (
                  <span key={idx}>{idx < stars ? "⭐" : "⚪"}</span>
                ))}
              </div>
            </div>
          </header>

          {/* Mission Details Card */}
          <div className={`bg-gradient-to-r ${scenario.bgGradient} p-6 rounded-2xl border border-slate-700 shadow-xl transition-all duration-500`}>
            <div className="flex justify-between items-center">
              <span className="text-xs font-bold tracking-wider uppercase text-amber-400 bg-slate-900/60 px-3 py-1 rounded-full border border-amber-500/20">
                Mission {currentLevel + 1} of {SCENARIOS.length}
              </span>
              {feedback?.type === "success" && (
                <span className="bg-emerald-500/20 text-emerald-300 text-xs font-semibold px-3 py-1 rounded-full border border-emerald-500/40 animate-pulse">
                  Mission Complete!
                </span>
              )}
            </div>
            
            <h2 className="text-2xl sm:text-3xl font-bold mt-2 text-white">{scenario.title}</h2>
            
            <div className="flex flex-wrap gap-3 mt-3 text-sm">
              <span className="bg-slate-900/80 px-3.5 py-1.5 rounded-xl border border-slate-700 flex items-center gap-1.5 font-medium text-slate-200">
                🌡️ <span>Weather:</span> <strong className="text-amber-300">{scenario.weather}</strong>
              </span>
              <span className="bg-slate-900/80 px-3.5 py-1.5 rounded-xl border border-slate-700 flex items-center gap-1.5 font-medium text-slate-200">
                🎯 <span>Activity:</span> <strong className="text-amber-300">{scenario.activity}</strong>
              </span>
            </div>
            
            <div className="mt-4 bg-slate-900/50 p-3 rounded-xl border border-white/5 flex items-start gap-2 text-amber-200 text-xs sm:text-sm">
              <span className="text-base">💡</span>
              <p><strong>Hint:</strong> {scenario.hint}</p>
            </div>
          </div>

          {/* Interactive Workspace Grid */}
          <div className="grid md:grid-cols-3 gap-6">
            
            {/* Avatar Display Column */}
            <div className={`bg-slate-800/90 p-6 rounded-2xl border border-slate-700 flex flex-col items-center justify-between min-h-[320px] shadow-lg ${scenario.avatarBg}`}>
              <div className="w-full text-center">
                <h3 className="text-sm font-bold uppercase tracking-wider text-slate-400">
                  Your Outfit
                </h3>
              </div>
              
              {/* Character Visual Box */}
              <div className={`relative flex flex-col items-center gap-2 bg-slate-900/90 p-5 rounded-2xl w-full max-w-[200px] border border-slate-700/80 shadow-inner my-4 transition-transform ${animateAvatar ? 'animate-bounce-short' : ''}`}>
                <div className="text-5xl my-1" title="Character Avatar">🧑</div>
                
                {/* Top Item */}
                <div className="w-full text-center py-1 rounded-lg bg-slate-800/60 border border-slate-700 min-h-[42px] flex items-center justify-center">
                  {selectedTop ? (
                    <span className="text-2xl" title={selectedTop.name}>{selectedTop.icon}</span>
                  ) : (
                    <span className="text-xs text-slate-500 font-medium">Top?</span>
                  )}
                </div>

                {/* Bottom Item */}
                <div className="w-full text-center py-1 rounded-lg bg-slate-800/60 border border-slate-700 min-h-[42px] flex items-center justify-center">
                  {selectedBottom ? (
                    <span className="text-2xl" title={selectedBottom.name}>{selectedBottom.icon}</span>
                  ) : (
                    <span className="text-xs text-slate-500 font-medium">Bottom?</span>
                  )}
                </div>

                {/* Shoes Item */}
                <div className="w-full text-center py-1 rounded-lg bg-slate-800/60 border border-slate-700 min-h-[42px] flex items-center justify-center">
                  {selectedShoes ? (
                    <span className="text-2xl" title={selectedShoes.name}>{selectedShoes.icon}</span>
                  ) : (
                    <span className="text-xs text-slate-500 font-medium">Shoes?</span>
                  )}
                </div>
              </div>

              {/* Action Buttons */}
              <div className="w-full flex gap-2">
                <button
                  onClick={handleReset}
                  className="px-3 py-3 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-semibold rounded-xl transition border border-slate-600"
                  title="Clear Selection"
                >
                  Clear 🔄
                </button>
                <button
                  onClick={handleCheckOutfit}
                  className="flex-1 py-3 bg-amber-500 hover:bg-amber-400 active:scale-95 text-slate-950 font-extrabold rounded-xl shadow-lg transition duration-150 text-sm tracking-wide"
                >
                  Check Outfit 🚀
                </button>
              </div>
            </div>

            {/* Wardrobe Selection Panel */}
            <div className="md:col-span-2 bg-slate-800/90 p-6 rounded-2xl border border-slate-700 flex flex-col gap-5 shadow-lg">
              <h3 className="text-sm font-bold uppercase tracking-wider text-slate-400">
                Pick Clothes (1 per category)
              </h3>

              {/* Category 1: Tops */}
              <div className="space-y-2">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-1.5">
                    <span className="w-5 h-5 rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center text-[10px]">1</span>
                    Choose Top
                  </span>
                  {selectedTop && (
                    <span className="text-[11px] text-emerald-400 font-medium">✓ Selected</span>
                  )}
                </div>
                <div className="grid grid-cols-3 gap-2 sm:gap-3">
                  {CLOTHES.tops.map((item) => {
                    const isSelected = selectedTop?.id === item.id;
                    return (
                      <button
                        key={item.id}
                        onClick={() => setSelectedTop(item)}
                        className={`p-3 rounded-xl border text-left flex flex-col items-center justify-center gap-1.5 transition-all duration-150 active:scale-95 ${
                          isSelected
                            ? "bg-amber-500 border-amber-400 text-slate-950 shadow-md font-bold scale-[1.02]"
                            : "bg-slate-700/40 border-slate-600/80 hover:bg-slate-700 text-slate-200 hover:border-slate-500"
                        }`}
                      >
                        <span className="text-2xl sm:text-3xl">{item.icon}</span>
                        <span className="text-xs text-center line-clamp-1">{item.name}</span>
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* Category 2: Bottoms */}
              <div className="space-y-2">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-1.5">
                    <span className="w-5 h-5 rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center text-[10px]">2</span>
                    Choose Bottom
                  </span>
                  {selectedBottom && (
                    <span className="text-[11px] text-emerald-400 font-medium">✓ Selected</span>
                  )}
                </div>
                <div className="grid grid-cols-3 gap-2 sm:gap-3">
                  {CLOTHES.bottoms.map((item) => {
                    const isSelected = selectedBottom?.id === item.id;
                    return (
                      <button
                        key={item.id}
                        onClick={() => setSelectedBottom(item)}
                        className={`p-3 rounded-xl border text-left flex flex-col items-center justify-center gap-1.5 transition-all duration-150 active:scale-95 ${
                          isSelected
                            ? "bg-amber-500 border-amber-400 text-slate-950 shadow-md font-bold scale-[1.02]"
                            : "bg-slate-700/40 border-slate-600/80 hover:bg-slate-700 text-slate-200 hover:border-slate-500"
                        }`}
                      >
                        <span className="text-2xl sm:text-3xl">{item.icon}</span>
                        <span className="text-xs text-center line-clamp-1">{item.name}</span>
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* Category 3: Shoes */}
              <div className="space-y-2">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-1.5">
                    <span className="w-5 h-5 rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center text-[10px]">3</span>
                    Choose Footwear
                  </span>
                  {selectedShoes && (
                    <span className="text-[11px] text-emerald-400 font-medium">✓ Selected</span>
                  )}
                </div>
                <div className="grid grid-cols-3 gap-2 sm:gap-3">
                  {CLOTHES.shoes.map((item) => {
                    const isSelected = selectedShoes?.id === item.id;
                    return (
                      <button
                        key={item.id}
                        onClick={() => setSelectedShoes(item)}
                        className={`p-3 rounded-xl border text-left flex flex-col items-center justify-center gap-1.5 transition-all duration-150 active:scale-95 ${
                          isSelected
                            ? "bg-amber-500 border-amber-400 text-slate-950 shadow-md font-bold scale-[1.02]"
                            : "bg-slate-700/40 border-slate-600/80 hover:bg-slate-700 text-slate-200 hover:border-slate-500"
                        }`}
                      >
                        <span className="text-2xl sm:text-3xl">{item.icon}</span>
                        <span className="text-xs text-center line-clamp-1">{item.name}</span>
                      </button>
                    );
                  })}
                </div>
              </div>

            </div>
          </div>

          {/* Feedback & Progression Banner */}
          {feedback && (
            <div className={`p-5 rounded-2xl border flex flex-col sm:flex-row items-center justify-between gap-4 shadow-xl transition-all ${
              feedback.type === "success" 
                ? "bg-emerald-950/90 border-emerald-500/80 text-emerald-100" 
                : feedback.type === "error"
                ? "bg-rose-950/90 border-rose-500/80 text-rose-100"
                : "bg-amber-950/90 border-amber-500/80 text-amber-100"
            }`}>
              <div className="flex items-center gap-3 text-center sm:text-left">
                <span className="text-3xl">
                  {feedback.type === "success" ? "🌟" : feedback.type === "error" ? "🤔" : "💡"}
                </span>
                <p className="font-semibold text-sm sm:text-base leading-snug">{feedback.message}</p>
              </div>

              {feedback.type === "success" && (
                <button
                  onClick={handleNextLevel}
                  className="w-full sm:w-auto px-6 py-3 bg-emerald-400 hover:bg-emerald-300 text-slate-950 font-black rounded-xl text-sm transition transform active:scale-95 whitespace-nowrap shadow-md"
                >
                  Next Mission ➔
                </button>
              )}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
